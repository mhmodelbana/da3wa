<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Da3wa</title></head>
<body style="margin:0;background:#FFFCF9"><div style="min-height:100vh;display:grid;place-items:center;font-family:Arial,sans-serif;color:#3A3A3A">جاري فتح الدعوة…</div>
<script>
(async()=>{
  try{
    const html=await fetch('./index.html',{cache:'no-store'}).then(r=>r.text());
    document.open();document.write(html);document.close();
  }catch(e){document.body.innerHTML='<div style="padding:40px;text-align:center">تعذر فتح الدعوة.</div>'}
})();
</script>
</body></html>
